# Packaging for the transferred worker source tree; equations stay in openstream.
[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "openstream-python"
dynamic = ["version"]
description = "Native Python scientific port of OpenSTREAM"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["numpy==2.5.4", "scipy==1.18.1", "CoolProp==8.0.0", "matplotlib==3.11.2"]

[tool.setuptools.dynamic]
version = {attr = "openstream.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["openstream*"]

[tool.setuptools.package-data]
openstream = ["data/*.inp", "data/*.json", "data/gui_baselines/**/*"]
