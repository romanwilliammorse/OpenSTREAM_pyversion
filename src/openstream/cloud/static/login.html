<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2980b9">
  <title>OpenSTREAM · Sign in</title>
  <link rel="stylesheet" href="/login-assets/login.css">
  <script src="/login-assets/login.js" defer></script>
</head>
<body>
  <main class="login-card">
    <img class="brand" src="/login-assets/logo-transparent.png" alt="OpenSTREAM">
    <h1>Sign in</h1>
    <form id="login-form">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required maxlength="1024" autofocus>
      <p id="login-error" role="alert" hidden></p>
      <button type="submit">Sign in</button>
    </form>
  </main>
</body>
</html>
