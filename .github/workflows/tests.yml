name: Native Python and GUI checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Install pinned dependencies and package
        run: |
          python -m pip install -r requirements.lock -r requirements-gui.lock
          python -m pip install --no-build-isolation -e ".[gui]"
          python -m pip check
      - name: Numerical and GUI tests
        run: python -m pytest -q
      - name: Frontend logic
        run: node --test tests/gui_frontend_logic.test.cjs tests/gui_navigation.test.cjs
      - name: Build installable distributions
        run: python -m build --no-isolation
